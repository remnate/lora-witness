[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lora-witness"
version = "0.1.0"
description = "Local CPU comparison of validated SDXL attention LoRA projection effects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.2.6", "safetensors==0.8.0", "threadpoolctl==3.6.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "build==1.3.0", "jsonschema==4.25.1"]
oracle = ["torch==2.8.0", "torchvision==0.23.0", "diffusers==0.43.0", "peft==0.22.0", "transformers==5.24.1", "accelerate==1.16.0", "einops==0.8.2"]

[project.scripts]
lora-witness = "lora_witness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lora_witness"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/docs", "/examples", "/README.md", "/LICENSE", "/NOTICE", "/CONTRIBUTING.md", "/pyproject.toml"]
